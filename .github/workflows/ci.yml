name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # swift build + swift test on the self-hosted hofn runner registered for
  # this repo (dryan-org/reusable-workflows/.github/workflows/swift-ci.yml).
  ci:
    uses: dryan-org/reusable-workflows/.github/workflows/swift-ci.yml@v1
